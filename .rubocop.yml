AllCops:
  TargetRubyVersion: 2.5
  NewCops: enable
  SuggestExtensions: false

Layout/AccessModifierIndentation:
  EnforcedStyle: outdent

Layout/DotPosition:
  EnforcedStyle: trailing

# Allow Steep type annotations such as `x = {} #: Hash[String, untyped]`.
Layout/LeadingCommentSpace:
  AllowSteepAnnotation: true

Layout/HashAlignment:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

# Specs define helper classes inside describe blocks and pass empty
# blocks to methods under test.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'

Lint/EmptyClass:
  Exclude:
    - 'spec/**/*'

Lint/SuppressedException:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/BlockNesting:
  Max: 2

Metrics/MethodLength:
  CountComments: false
  Max: 15

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

Style/CollectionMethods:
  PreferredMethods:
    map:      'collect'
    reduce:   'inject'
    find:     'detect'
    find_all: 'select'

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/EachWithObject:
  Enabled: false

Style/Encoding:
  Enabled: false

Style/ExpandPathArguments:
  Enabled: false

# The magic comment would freeze strings OmniAuth returns, which callers
# may mutate. The frozen-string-compat CI job checks that OmniAuth itself
# works with frozen string literals.
Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedStyle: hash_rockets

Style/Lambda:
  Enabled: false

# Public APIs that take a positional boolean.
Style/OptionalBooleanParameter:
  AllowedMethods:
    - camelize
    - options

Style/RaiseArgs:
  EnforcedStyle: compact
