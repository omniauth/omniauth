name: JRuby
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The jobs only read the repository, so don't give them write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    # jruby-head is unreleased and can break for reasons outside OmniAuth, so
    # don't fail the build on it.
    continue-on-error: ${{ matrix.jruby == 'jruby-head' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        jruby: [jruby, jruby-head]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: ${{ matrix.jruby }}
        bundler-cache: true
      env:
        JRUBY_OPTS: --debug
    - name: Run tests
      env:
        JRUBY_OPTS: --debug
      run: bundle exec rake spec
