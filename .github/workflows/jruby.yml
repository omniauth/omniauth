name: JRuby
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The jobs only read the repository, so don't give them write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        jruby: [jruby, jruby-head]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
      with:
        ruby-version: ${{ matrix.jruby }}
        bundler-cache: true
      env:
        JRUBY_OPTS: --debug
    - name: Run tests
      env:
        JRUBY_OPTS: --debug
      run: bundle exec rake spec
