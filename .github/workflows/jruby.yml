name: JRuby
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The jobs only read the repository, so don't give them write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    # jruby-head is unreleased and can break for reasons outside OmniAuth, so
    # don't fail the build on it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        jruby: [jruby, jruby-head]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: ruby
      name: Set up Ruby
      continue-on-error: ${{ matrix.jruby == 'jruby-head' }}
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ matrix.jruby }}
        bundler-cache: true
      env:
        JRUBY_OPTS: --debug
    - id: tests
      name: Run tests
      continue-on-error: ${{ matrix.jruby == 'jruby-head' }}
      env:
        JRUBY_OPTS: --debug
      run: bundle exec rake spec
    - name: Note an advisory failure
      if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
      run: echo "::warning title=Advisory failure::A step failed, but this job is allowed to fail, so the build still passes"
