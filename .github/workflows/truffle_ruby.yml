name: TruffleRuby
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The jobs only read the repository, so don't give them write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    # truffleruby-head is unreleased and can break for reasons outside
    # OmniAuth, so don't fail the build on it.
    strategy:
      fail-fast: false
      matrix:
        # TruffleRuby doesn't support Windows.
        os: [ubuntu, macos]
        ruby: [truffleruby, truffleruby-head]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: ruby
      name: Set up Ruby
      continue-on-error: ${{ matrix.ruby == 'truffleruby-head' }}
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - id: tests
      name: Run tests
      continue-on-error: ${{ matrix.ruby == 'truffleruby-head' }}
      run: bundle exec rake spec
    - name: Note an advisory failure
      if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
      run: echo "::warning title=Advisory failure::A step failed, but this job is allowed to fail, so the build still passes"
