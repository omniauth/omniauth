name: TruffleRuby
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The jobs only read the repository, so don't give them write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    # truffleruby-head is unreleased and can break for reasons outside
    # OmniAuth, so don't fail the build on it.
    continue-on-error: ${{ matrix.ruby == 'truffleruby-head' }}
    strategy:
      fail-fast: false
      matrix:
        # TruffleRuby doesn't support Windows.
        os: [ubuntu, macos]
        ruby: [truffleruby, truffleruby-head]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rake spec
